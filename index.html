
<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>
    <h1>Grade Calculator</h1>
    <p>Enter your three grades below to calculate your average.</p>

    <p>Enter three grades to calculate your average.</p>

    <input type="number" id="grade1" placeholder="First grade">
    <br><br>

    <input type="number" id="grade2" placeholder="Second grade">
    <br><br>

    <input type="number" id="grade3" placeholder="Third grade">
    <br><br>

    <button onclick="calculateGrade()">Calculate Average</button>

    <h3 id="result"></h3>

    <script>
        function calculateGrade() {
            let g1 = Number(document.getElementById("grade1").value);
            let g2 = Number(document.getElementById("grade2").value);
            let g3 = Number(document.getElementById("grade3").value);

            if (
                document.getElementById("grade1").value === "" ||
                document.getElementById("grade2").value === "" ||
                document.getElementById("grade3").value === "" ||
                g1 < 0 || g1 > 100 ||
                g2 < 0 || g2 > 100 ||
                g3 < 0 || g3 > 100
            ) {
                document.getElementById("result").innerText =
                    "Enter grades between 0 and 100.";
                return;
            }

            let average = (g1 + g2 + g3) / 3;

            document.getElementById("result").innerText =
                "Your average is: " + average.toFixed(2);
        }
    </script>
</body>
</html>
